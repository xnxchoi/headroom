[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "headroom-macos-overlay"
version = "0.1.0"
description = "Local macOS Headroom overlay: lifecycle stop + dashboard injection"
requires-python = ">=3.10"
dependencies = []

[project.entry-points."headroom.proxy_extension"]
macos-overlay = "headroom_macos_overlay.proxy_ext:install"

[project.entry-points."headroom.cli_extension"]
macos-overlay = "headroom_macos_overlay.cli_ext:register"

[tool.setuptools.packages.find]
where = ["src"]
